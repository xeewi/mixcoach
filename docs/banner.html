<!doctype html><html lang="en"><head><meta charset="utf-8"><title>MixCoach banner</title><style>
@font-face{font-family:Archivo;src:url(assets/fonts/archivo-latin.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%}
*{box-sizing:border-box;margin:0}
body{width:1280px;height:640px;overflow:hidden;background:#C8CBD0;color:#0E0E0F;font-family:Archivo,sans-serif;display:grid;grid-template-columns:1fr 520px;gap:56px;padding:56px 64px}
.l{display:flex;flex-direction:column}
.mark{display:flex;align-items:center;gap:14px;padding-bottom:18px;border-bottom:1px solid #0E0E0F}
.mark img{width:40px;height:40px}.mark b{font-size:28px;font-weight:700;letter-spacing:-.01em;flex:1}
.label{font-stretch:125%;font-weight:600;font-size:14px;letter-spacing:.16em;text-transform:uppercase}
h1{font-size:72px;line-height:1;letter-spacing:-.035em;font-weight:500;margin-top:56px}
p{margin-top:auto;font-size:22px;line-height:1.4;color:#34373D;max-width:22em}
.s{display:flex;flex-direction:column;height:528px;background:#0E0E0F}
.s div{display:flex;justify-content:space-between;align-items:center;padding:0 22px;color:#0E0E0F}
.s .on{box-shadow:inset 0 0 0 7px #0E0E0F}.s b{font-size:18px}
</style></head><body>
<div class="l"><div class="mark"><img src="assets/logo.svg" alt=""><b>MixCoach</b><span class="label">MXC 001</span></div>
<h1>Pad. 250⁠–⁠500&nbsp;Hz. Cut it there.</h1>
<p>A free mixing &amp; mastering coach for Ableton Live: which track to fix, how, and why.</p></div>
<div class="s">
<div style="flex:1.4;background:#8EC3EA"><span class="label">Air 6–20k</span></div>
<div style="flex:2;background:#D9468E"><span class="label">High mids 2–6k</span></div>
<div style="flex:2.6;background:#E8471C"><span class="label">Mids 500–2k</span></div>
<div class="on" style="flex:4.6;background:#F4C300"><span class="label">Low mids 250–500</span><b>PAD 60%</b></div>
<div style="flex:3.4;background:#2FA35F"><span class="label">Bass 60–250</span></div>
<div style="flex:3;background:#2343B0;color:#fff"><span class="label">Sub 20–60</span></div>
</div></body></html>
